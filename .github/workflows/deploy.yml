name: Build, Push and Deploy to Cloud Run

on:
  push:
    branches: [main]
    # Skip deploy when only these files change (they don't affect the running app)
    paths-ignore:
      - 'README.md'
      - '**.md'
      - '.gitignore'
      - '.env.example'
      - 'evaluation_cache.json'
  workflow_dispatch:  # Run manually from Actions tab (e.g. after updating secrets)

env:
  REGION: asia-south1
  # Cloud SQL in Mumbai (same region as Cloud Run)
  CLOUD_SQL_INSTANCE: asia-south1:text-to-sql-db
  ARTIFACT_REPO: text-to-sql-docker-image-repository
  IMAGE_NAME: text-to-sql
  SERVICE_NAME: text-to-sql

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${GCP_PROJECT_ID}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          INSTANCE="${GCP_PROJECT_ID}:${{ env.CLOUD_SQL_INSTANCE }}"
          SOCKET="/cloudsql/${INSTANCE}"
          # Use echo (not indented heredoc) so env.yaml keys are valid
          {
            echo "DB_HOST: \"${SOCKET}\""
            echo "CLOUD_SQL_INSTANCE: \"${INSTANCE}\""
            echo "INSTANCE_CONNECTION_NAME: \"${INSTANCE}\""
            echo "DB_PORT: \"3306\""
            echo "DB_USER: \"${DB_USER}\""
            echo "DB_PASSWORD: \"${DB_PASSWORD}\""
            echo "DB_NAME: \"${DB_NAME}\""
            echo "GOOGLE_API_KEY: \"${GOOGLE_API_KEY}\""
            echo "GROQ_API_KEY: \"${GROQ_API_KEY}\""
          } > /tmp/env.yaml
          cat /tmp/env.yaml
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --add-cloudsql-instances "${INSTANCE}" \
            --env-vars-file=/tmp/env.yaml

      - name: Verify Cloud Run database env
        run: |
          DB_HOST=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format="jsonpath={.spec.template.spec.containers[0].env[?(@.name=='DB_HOST')].value}")
          echo "DB_HOST on Cloud Run: ${DB_HOST}"
          case "${DB_HOST}" in
            /cloudsql/*) echo "DB_HOST looks correct." ;;
            *)
              echo "::error::DB_HOST is not a Cloud SQL socket path. Deploy misconfigured."
              exit 1
              ;;
          esac
