name: Build, Push and Deploy to Cloud Run

on:
  push:
    branches: [main]
    # Skip deploy when only these files change (they don't affect the running app)
    paths-ignore:
      - 'README.md'
      - '**.md'
      - '.gitignore'
      - '.env.example'
      - 'evaluation_cache.json'
  workflow_dispatch:  # Run manually from Actions tab (e.g. after updating secrets)

env:
  REGION: asia-south1
  ARTIFACT_REPO: text-to-sql-docker-image-repository
  IMAGE_NAME: text-to-sql
  SERVICE_NAME: text-to-sql

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${GCP_PROJECT_ID}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          CLOUD_SQL_SOCKET="/cloudsql/${GCP_PROJECT_ID}:asia-south1:text-to-sql-db"
          # YAML file avoids broken parsing when passwords/keys contain commas or special chars
          cat > /tmp/env.yaml <<EOF
          DB_HOST: "${CLOUD_SQL_SOCKET}"
          DB_PORT: "3306"
          DB_USER: "${DB_USER}"
          DB_PASSWORD: "${DB_PASSWORD}"
          DB_NAME: "${DB_NAME}"
          GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
          GROQ_API_KEY: "${GROQ_API_KEY}"
          EOF
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --add-cloudsql-instances "${GCP_PROJECT_ID}:asia-south1:text-to-sql-db" \
            --env-vars-file=/tmp/env.yaml
